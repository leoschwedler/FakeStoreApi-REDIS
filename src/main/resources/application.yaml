server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: mangahub
  config:
    import: "optional:file:.env[.properties]"


  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:mangahub}
    username: ${POSTGRES_USER:mangahub}
    password: ${POSTGRES_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

  cache:
    type: redis

  flyway:
    enabled: true
    locations: classpath:db/migration
    # baseline-on-migrate: true

  jpa:
    hibernate:
      # Flyway é o dono do schema; o Hibernate só valida (inofensivo até adicionar o starter JPA)
      ddl-auto: validate
    open-in-view: false

  docker:
    compose:
      # sobe/derruba o compose.yaml automaticamente ao rodar a aplicação (dev)
      lifecycle-management: start-and-stop
api:
  url: ${FAKE_API}